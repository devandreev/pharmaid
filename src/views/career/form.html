<section class="career-form section" id="career-form">
  <div class="career-form__wrapper wrapper">
    <div class="section__header">
      <p class="section__label">Свяжитесь с&nbsp;нами</p>

      <h2 class="section__heading">
        Хотите стать частью ФАРМ&nbsp;ЭЙД?
      </h2>
    </div>

    <div class="career-form__content">
      <div class="career-form__sidebar">
        <a class="career-form__hh button-outline" href="#" target="_blank" rel="noopener noreferrer">
          Мы на HH.ru
        </a>

        <div class="career-form__desc">
          <p class="career-form__desc-text">
            Даже если сейчас на&nbsp;сайте нет открытой вакансии по&nbsp;вашему
            профилю, вы&nbsp;можете отправить резюме через форму ниже.
          </p>
          <p class="career-form__desc-text">
            Мы внимательно рассматриваем все заявки и&nbsp;связываемся
            с&nbsp;кандидатами при появлении подходящих возможностей.
          </p>
        </div>
      </div>

      <form class="career-form__form js-form" novalidate>
        <div class="form-fields">
          <label class="form-field form-field--required">
            <input
              class="form-field__input"
              type="text"
              name="name"
              placeholder="Имя"
              data-rule="required"
              data-error="Пожалуйста, введите ваше имя"
            />
          </label>

          <label class="form-field form-field--required">
            <input
              class="form-field__input"
              type="tel"
              name="phone"
              data-rule="required phone"
              data-error="Пожалуйста, введите номер телефона"
            />
          </label>

          <label class="form-field form-field--required">
            <input
              class="form-field__input"
              type="text"
              name="city"
              placeholder="Город"
              data-rule="required"
              data-error="Пожалуйста, введите город"
            />
          </label>

          <label class="form-field">
            <input
              class="form-field__input"
              type="email"
              name="email"
              placeholder="Электронная почта"
              data-rule="email"
              data-error="Неверный формат почты"
            />
          </label>

          <label class="form-field form-field--file form-field--required">
            <span class="form-field__file-box">
              <span class="form-field__file-icon"></span>
              <span class="form-field__file-text">Резюме:</span>
              <span class="form-field__file-placeholder" data-placeholder="Word или PDF до 20 мб">Word или PDF до 20 мб</span>
            </span>
            <input
              class="form-field__file"
              type="file"
              name="resume"
              accept=".doc,.docx,.pdf"
              data-rule="required file"
              data-max-size="20"
              data-error="Пожалуйста, прикрепите резюме"
              data-error-format="Допустимые форматы: Word или PDF"
              data-error-size="Максимальный размер файла — 20 МБ"
            />
          </label>

          <label class="form-field form-field--textarea">
            <textarea
              class="form-field__textarea"
              name="message"
              placeholder="Сообщение"
            ></textarea>
          </label>
        </div>

        <div class="career-form__bottom">
          <label class="form-agreement">
            <input
              class="form-agreement__input"
              type="checkbox"
              name="agreement"
              data-rule="required"
              data-error="Необходимо согласие на обработку персональных данных"
            />

            <span class="form-agreement__box"></span>

            <span class="form-agreement__text">
              Я&nbsp;согласен на&nbsp;обработку
              <a href="/policy" class="form-agreement__link js-policy">персональных данных</a>
            </span>
          </label>

          <button class="form-submit button-blue" type="submit">
            Отправить резюме
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
