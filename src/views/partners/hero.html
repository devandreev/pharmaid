<section class="inner-hero partners-hero">
  <div class="inner-hero__bg">
    <!-- Постеры — первые кадры соответствующих роликов, кадрировка совпадает один в один -->
    <picture class="inner-hero__bg-picture">
      <source srcset="./images/partners/partners-hero-poster-1920.avif" media="(min-width: 1380px)" type="image/avif">
      <source srcset="./images/partners/partners-hero-poster-1280.avif" media="(min-width: 1280px)" type="image/avif">
      <source srcset="./images/partners/partners-hero-poster-1024.avif" media="(min-width: 1024px)" type="image/avif">
      <source srcset="./images/partners/partners-hero-poster-768.avif" media="(min-width: 768px)" type="image/avif">
      <source srcset="./images/partners/partners-hero-poster-390.avif" type="image/avif">
      <img class="inner-hero__bg-image" src="./images/partners/partners-hero-poster-390.avif" alt="">
    </picture>

    <video
      class="inner-hero__bg-video js-hero-video"
      data-src-390="./videos/partners/partners-hero-390.mp4"
      data-src-768="./videos/partners/partners-hero-768.mp4"
      data-src-1024="./videos/partners/partners-hero-1024.mp4"
      data-src-1280="./videos/partners/partners-hero-1280.mp4"
      data-src-1920="./videos/partners/partners-hero-1920.mp4"
      muted
      loop
      playsinline
      preload="metadata"
    ></video>
  </div>

  <div class="inner-hero__wrapper wrapper">
    <h1 class="inner-hero__title">Партнерам</h1>
  </div>
</section>
